# ==========================================
# 📂 存放路徑：dayNoteApp/.github/workflows/docker-build.yml
# 📖 檔案解說：這是一個舊版或「大雙拼」的 GitHub Actions 腳本，它會同時把前端與後端都打包起來上傳。
# 🚀 觸發條件：當有人把程式碼推送到 main 或 master 分支時就會觸發。
# ==========================================

name: Build and Push dayNoteApp Images # 這個腳本的名字

on:
  push:
    branches:
      - master
      - main # 只要推送到這兩個分支的其中一個就會觸發

env:
  REGISTRY: ghcr.io # 統一宣告我們要上傳到 GitHub 的 Docker 倉庫

jobs:
  # ==========================================
  # 工作區塊 1：打包前端
  # ==========================================
  build-and-push-frontend:
    runs-on: ubuntu-latest # 在最新的 Ubuntu 虛擬機上跑
    permissions:
      contents: read
      packages: write

    steps:
      # [步驟 1] 下載程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # [步驟 2] 登入 GitHub 倉庫
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [步驟 3] 產生前端的標籤 (Tags)
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-daynote-frontend

      # [步驟 4] 執行 Docker 打包並上傳前端
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # 去 frontend 資料夾找 Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  # ==========================================
  # 工作區塊 2：打包後端
  # ==========================================
  build-and-push-backend:
    runs-on: ubuntu-latest # 開啟另一台虛擬機平行處理後端
    permissions:
      contents: read
      packages: write

    steps:
      # [步驟 1] 下載程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # [步驟 2] 登入 GitHub 倉庫
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [步驟 3] 產生後端的標籤 (Tags)
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-daynote-backend

      # [步驟 4] 執行 Docker 打包並上傳後端
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend # 去 backend 資料夾找 Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
