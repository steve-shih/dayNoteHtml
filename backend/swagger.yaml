openapi: 3.0.0
info:
  title: dayNoteApp API (Obsidian & Claude AI Edition)
  description: API specification for dayNoteApp including Authentication, Notes, Categories, Obsidian Knowledge Graph, MindMap, and Claude AI Assistant.
  version: 2.0.0
servers:
  - url: http://localhost:5000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      summary: Health check endpoint
      security: []
      responses:
        '200':
          description: Server status ok

  /api/auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Registration successful
        '400':
          description: Missing fields or user exists

  /api/auth/login:
    post:
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful with JWT token
        '401':
          description: Invalid credentials

  /api/auth/me:
    get:
      summary: Get current authenticated user info
      responses:
        '200':
          description: Authenticated user details

  /api/categories:
    get:
      summary: Get user categories
      responses:
        '200':
          description: List of categories
    post:
      summary: Add a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
      responses:
        '200':
          description: Category added successfully

  /api/categories/{category}:
    delete:
      summary: Delete a category
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted

  /api/notes:
    get:
      summary: Get user notes list
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of notes

  /api/notes/{note_id}:
    get:
      summary: Get detailed note content by ID
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed note with tags and wikilinks
    delete:
      summary: Delete a note
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Note deleted successfully

  /api/notes/{note_id}/backlinks:
    get:
      summary: Get backlinks referencing this note
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Linked and unlinked backlink references

  /api/notes/{note_id}/save:
    post:
      summary: Save note text content
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Note content updated successfully

  /api/upload:
    post:
      summary: Upload a physical file note
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
      responses:
        '201':
          description: File uploaded successfully

  /api/ai/upload:
    post:
      summary: Create an AI-generated note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                extension:
                  type: string
      responses:
        '201':
          description: AI Note created

  /api/notes/url:
    post:
      summary: Save a web URL note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                url:
                  type: string
                category:
                  type: string
      responses:
        '201':
          description: Web URL note saved

  /api/graph/nodes:
    get:
      summary: Get knowledge graph nodes and edges for Obsidian graph view
      responses:
        '200':
          description: Nodes and links object for visualization

  /api/graph/mindmap/{note_id}:
    get:
      summary: Get mindmap tree hierarchy for a specific note
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mindmap tree JSON structure

  /api/claude/config:
    get:
      summary: Get Claude AI configuration settings
      responses:
        '200':
          description: Current Claude config settings
    post:
      summary: Update Claude API settings in config.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                model:
                  type: string
                max_tokens:
                  type: integer
                temperature:
                  type: number
      responses:
        '200':
          description: Claude configuration updated

  /api/claude/chat:
    post:
      summary: Send prompt to Anthropic Claude AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                note_id:
                  type: string
      responses:
        '200':
          description: Claude response text

  /api/claude/summarize:
    post:
      summary: Generate summary and tag suggestions using Claude
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note_id:
                  type: string
      responses:
        '200':
          description: Summary text and tags array

  /api/claude/mindmap:
    post:
      summary: Generate mindmap JSON outline using Claude AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                note_id:
                  type: string
      responses:
        '200':
          description: Mindmap JSON structure generated by Claude

  /api/claude/fix-title:
    post:
      summary: Automatically analyze note content and correct title using Claude AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note_id:
                  type: string
      responses:
        '200':
          description: Suggested clean title updated successfully

  /api/claude/rag:
    post:
      summary: Knowledge base RAG search and AI question answering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
      responses:
        '200':
          description: AI generated RAG response with referenced note sources


