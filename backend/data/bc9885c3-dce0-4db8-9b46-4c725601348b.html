<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevOps / SRE 企業架構流量與故障模擬器</title>
<style>
:root{
  --bg:#07111f;--panel:#0d1b2e;--panel2:#10243d;--line:#6d8db3;--text:#e7f0ff;--muted:#9fb4d0;
  --blue:#38bdf8;--green:#4ade80;--red:#fb7185;--yellow:#facc15;--purple:#c084fc;--orange:#fb923c;
}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12345b 0,#07111f 52%,#030712 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;overflow-x:hidden}.app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}.sidebar{background:rgba(7,17,31,.94);border-right:1px solid rgba(255,255,255,.1);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.main{padding:18px}h1{font-size:22px;margin:0 0 8px}h2{font-size:16px;margin:18px 0 10px;color:#bfdbfe}.desc{color:var(--muted);font-size:13px;line-height:1.55}.control{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px;margin:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:8px 0}label{display:block;color:#c7d7ef;font-size:12px;margin-bottom:5px}select,input[type=number],input[type=range]{width:100%;background:#081527;color:var(--text);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:9px}button{border:0;border-radius:10px;padding:10px 12px;background:#2563eb;color:white;cursor:pointer;font-weight:700}button:hover{filter:brightness(1.12)}button.secondary{background:#334155}button.danger{background:#be123c}button.good{background:#15803d}button.warn{background:#b45309}.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.canvas-card{position:relative;background:rgba(9,22,39,.86);border:1px solid rgba(255,255,255,.12);border-radius:22px;min-height:720px;box-shadow:0 24px 80px rgba(0,0,0,.38);overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035)}.badge{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid rgba(255,255,255,.13);border-radius:999px;color:#dbeafe;background:rgba(255,255,255,.05);font-size:12px}.diagram{position:relative;height:660px}.svg-layer{position:absolute;inset:0;width:100%;height:100%;z-index:1}.node{position:absolute;z-index:2;width:150px;min-height:76px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(180deg,rgba(20,39,68,.96),rgba(9,21,37,.96));border-radius:16px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.25);transition:.25s}.node:hover{transform:translateY(-2px);border-color:#93c5fd}.node .title{font-weight:800;font-size:13px}.node .sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}.node .metrics{font-size:10px;color:#cbd5e1;margin-top:7px}.node.failed{border-color:var(--red);box-shadow:0 0 22px rgba(251,113,133,.85),0 8px 28px rgba(0,0,0,.3);animation:pulseRed 1.1s infinite}.node.scaled{border-color:var(--green);box-shadow:0 0 16px rgba(74,222,128,.35)}@keyframes pulseRed{50%{box-shadow:0 0 42px rgba(251,113,133,1),0 8px 28px rgba(0,0,0,.3)}}.node.vm{background:linear-gradient(180deg,rgba(30,58,138,.88),rgba(15,23,42,.96))}.node.nginx{background:linear-gradient(180deg,rgba(3,105,161,.88),rgba(15,23,42,.96))}.node.app{background:linear-gradient(180deg,rgba(22,101,52,.82),rgba(15,23,42,.96))}.node.db{background:linear-gradient(180deg,rgba(126,34,206,.78),rgba(15,23,42,.96))}.node.k8s{background:linear-gradient(180deg,rgba(180,83,9,.82),rgba(15,23,42,.96))}.node.infra{background:linear-gradient(180deg,rgba(71,85,105,.94),rgba(15,23,42,.96))}.packet{position:absolute;width:14px;height:14px;border-radius:50%;z-index:5;pointer-events:none;box-shadow:0 0 14px currentColor}.packet.req{background:var(--blue);color:var(--blue)}.packet.res{background:var(--green);color:var(--green)}.packet.drop{background:var(--red);color:var(--red)}.legend{display:flex;gap:10px;flex-wrap:wrap}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px}.stat strong{font-size:22px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.log{margin-top:14px;background:#030712;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px;height:150px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#d1d5db}.modal{position:fixed;inset:0;background:rgba(0,0,0,.56);display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modal-card{width:min(720px,92vw);background:#081527;border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:20px;box-shadow:0 28px 90px rgba(0,0,0,.6)}.modal-card h3{margin-top:0}.fix-code{background:#020617;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;white-space:pre-wrap;color:#bfdbfe;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;background:rgba(255,255,255,.08);margin:2px}.section-title{font-weight:800;color:#dbeafe;margin:4px 0 8px}.bar{height:8px;background:#1f2937;border-radius:999px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:#38bdf8;width:10%}@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.stats{grid-template-columns:1fr 1fr}.canvas-card{min-height:780px}.diagram{height:700px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>企業架構模擬器</h1>
    <p class="desc">封包會貼著線走：藍色為 Request，綠色為 Response。可切換小／中／大公司架構，模擬負載平衡、故障、修復、水平擴容與垂直升規。</p>

    <div class="control">
      <div class="section-title">STEP_01 架構與流量</div>
      <div class="field"><label>公司規模 / 架構</label><select id="architecture"></select></div>
      <div class="row">
        <div class="field"><label>流量筆數</label><input id="trafficCount" type="number" min="1" max="200" value="18"></div>
        <div class="field"><label>動畫速度</label><select id="speed"><option value="2200">很慢</option><option value="1500" selected>慢</option><option value="900">普通</option><option value="450">快</option></select></div>
      </div>
      <div class="field"><label>負載平衡位置</label><select id="balanceAt"></select></div>
      <div class="field"><label>平衡演算法</label><select id="algorithm"><option value="roundRobin">Round Robin 輪詢</option><option value="random">Random 隨機</option><option value="leastConnection">Least Connection 最少連線</option><option value="ipHash">IP Hash 固定來源</option><option value="weighted">Weighted 加權</option></select></div>
      <div class="button-grid"><button onclick="startTraffic()">開始流量</button><button class="secondary" onclick="stopTraffic()">停止</button></div>
    </div>

    <div class="control">
      <div class="section-title">STEP_02 故障演練</div>
      <div class="field"><label>選擇故障元件</label><select id="failureTarget"></select></div>
      <div class="button-grid"><button class="danger" onclick="failSelected()">模擬故障</button><button class="good" onclick="repairSelected()">一鍵修復</button></div>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="showFixGuide()">查看修復說明</button>
    </div>

    <div class="control">
      <div class="section-title">STEP_03 擴容 / 升規</div>
      <div class="button-grid"><button class="good" onclick="horizontalScale()">水平擴容 +1</button><button class="warn" onclick="verticalScale()">垂直升規</button></div>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="resetScale()">重置擴容</button>
      <p class="desc">水平擴容 = 增加 App / Pod 數量。垂直升規 = 提高單台 VM / Node 的 CPU 與 Memory。</p>
    </div>

    <div class="control">
      <div class="section-title">圖例</div>
      <div class="legend"><span><i class="dot" style="background:var(--blue)"></i> Request</span><span><i class="dot" style="background:var(--green)"></i> Response</span><span><i class="dot" style="background:var(--red)"></i> 故障</span><span><i class="dot" style="background:var(--yellow)"></i> 重試/繞路</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="canvas-card">
      <div class="toolbar"><div><span class="badge" id="archBadge">架構</span> <span class="badge" id="algoBadge">演算法</span></div><div class="badge">封包沿線移動</div></div>
      <div class="diagram" id="diagram"><svg class="svg-layer" id="svg"></svg></div>
    </div>
    <div class="stats">
      <div class="stat"><strong id="totalReq">0</strong><span>送出 Request</span></div>
      <div class="stat"><strong id="successReq">0</strong><span>成功 Response</span></div>
      <div class="stat"><strong id="dropReq">0</strong><span>故障 / 丟棄</span></div>
      <div class="stat"><strong id="scaleInfo">0</strong><span>水平擴容節點</span></div>
    </div>
    <div class="log" id="log"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="modal-card"><h3 id="modalTitle">修復說明</h3><div id="modalBody"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="good" onclick="repairSelected();closeModal()">一鍵修復</button><button class="secondary" onclick="closeModal()">關閉</button></div></div></div>

<script>
const architectures={
  small:{name:'小公司：單台 VM',balanceOptions:[['nginx','Nginx / PM2 單機內部']],nodes:[
    {id:'user',title:'User',sub:'使用者 / Browser',type:'infra',x:40,y:280},
    {id:'vm1',title:'GCP VM',sub:'Public IP 34.x.x.x\nNginx + PM2 + Node.js',type:'vm',x:250,y:200,w:210,h:220},
    {id:'nginx',title:'Nginx',sub:'SSL / Reverse Proxy',type:'nginx',x:280,y:235},
    {id:'app1',title:'Node.js App',sub:'PM2 管理 process',type:'app',x:280,y:340},
    {id:'db1',title:'DB',sub:'MongoDB / MySQL',type:'db',x:540,y:280}
  ],edges:[['user','nginx'],['nginx','app1'],['app1','db1']]},
  medium:{name:'中型：獨立 Nginx VM + 多台 App VM',balanceOptions:[['nginx','獨立 Nginx VM'],['app','App VM 層']],nodes:[
    {id:'user',title:'User',sub:'外部流量',type:'infra',x:35,y:290},
    {id:'nginx',title:'Nginx VM',sub:'Public IP\nReverse Proxy / LB',type:'nginx',x:240,y:275},
    {id:'app1',title:'App VM 1',sub:'Docker / Node.js\nCPU 2C RAM 4G',type:'app',x:500,y:130,weight:3},
    {id:'app2',title:'App VM 2',sub:'Docker / Node.js\nCPU 2C RAM 4G',type:'app',x:500,y:290,weight:1},
    {id:'app3',title:'App VM 3',sub:'Docker / Node.js\nCPU 2C RAM 4G',type:'app',x:500,y:450,weight:2},
    {id:'db1',title:'DB VM',sub:'Private IP\nDatabase',type:'db',x:760,y:290}
  ],edges:[['user','nginx'],['nginx','app1'],['nginx','app2'],['nginx','app3'],['app1','db1'],['app2','db1'],['app3','db1']]},
  large:{name:'大公司：GCP LB + GKE / K8s',balanceOptions:[['gcpLb','GCP Load Balancer'],['ingress','K8s Ingress'],['service','K8s Service / Pod 層']],nodes:[
    {id:'user',title:'User',sub:'全球使用者',type:'infra',x:25,y:290},
    {id:'gcpLb',title:'GCP Global LB',sub:'SSL / Health Check\nGlobal Anycast',type:'infra',x:210,y:290},
    {id:'ingress',title:'Nginx Ingress',sub:'K8s 入口路由',type:'nginx',x:420,y:290},
    {id:'svc',title:'K8s Service',sub:'ClusterIP / Service Discovery',type:'k8s',x:625,y:290},
    {id:'app1',title:'Pod 1',sub:'Container: Node API\nCPU 500m RAM 512Mi',type:'app',x:845,y:120,weight:3},
    {id:'app2',title:'Pod 2',sub:'Container: Node API\nCPU 500m RAM 512Mi',type:'app',x:845,y:285,weight:1},
    {id:'app3',title:'Pod 3',sub:'Container: Node API\nCPU 500m RAM 512Mi',type:'app',x:845,y:450,weight:2},
    {id:'db1',title:'Cloud SQL',sub:'Managed DB',type:'db',x:1080,y:290}
  ],edges:[['user','gcpLb'],['gcpLb','ingress'],['ingress','svc'],['svc','app1'],['svc','app2'],['svc','app3'],['app1','db1'],['app2','db1'],['app3','db1']]}
};
let state={arch:'medium',nodes:[],edges:[],failed:new Set(),rr:0,trafficTimer:null,stats:{total:0,success:0,drop:0},connections:{},scale:0,vertical:0};
const $=id=>document.getElementById(id);
function init(){Object.entries(architectures).forEach(([id,a])=>$('architecture').add(new Option(a.name,id)));$('architecture').value='medium';$('architecture').onchange=()=>loadArch($('architecture').value);$('algorithm').onchange=()=>updateBadges();loadArch('medium');}
function loadArch(id){state={...state,arch:id,nodes:JSON.parse(JSON.stringify(architectures[id].nodes)),edges:JSON.parse(JSON.stringify(architectures[id].edges)),failed:new Set(),rr:0,connections:{},scale:0,vertical:0};renderControls();render();resetStats();log('載入架構：'+architectures[id].name);}
function renderControls(){const arch=architectures[state.arch];$('balanceAt').innerHTML='';arch.balanceOptions.forEach(([v,t])=>$('balanceAt').add(new Option(t,v)));$('failureTarget').innerHTML='';state.nodes.filter(n=>n.id!=='user').forEach(n=>$('failureTarget').add(new Option(n.title,n.id)));updateBadges();}
function updateBadges(){$('archBadge').textContent=architectures[state.arch].name;$('algoBadge').textContent=$('algorithm').selectedOptions[0].textContent;}
function center(n){return{x:n.x+(n.w||150)/2,y:n.y+(n.h||76)/2}}
function render(){const d=$('diagram');d.querySelectorAll('.node,.packet').forEach(e=>e.remove());const svg=$('svg');svg.innerHTML='';state.edges.forEach(([a,b])=>drawLine(a,b));state.nodes.forEach(n=>{const el=document.createElement('div');el.className=`node ${n.type||''} ${state.failed.has(n.id)?'failed':''} ${(n.scaled||state.vertical)?'scaled':''}`;el.style.left=n.x+'px';el.style.top=n.y+'px';if(n.w)el.style.width=n.w+'px';if(n.h)el.style.height=n.h+'px';el.onclick=()=>{ $('failureTarget').value=n.id; showFixGuide();};el.innerHTML=`<div class="title">${n.title}</div><div class="sub">${n.sub.replace(/\n/g,'<br>')}</div><div class="metrics">${metrics(n)}</div>`;d.appendChild(el);});}
function metrics(n){const c=state.connections[n.id]||0;const cpu=Math.min(96,18+c*8+state.vertical*12);const mem=Math.min(96,24+c*6+state.vertical*10);return `連線 ${c}｜CPU ${cpu}%<div class="bar"><i style="width:${cpu}%"></i></div>RAM ${mem}%<div class="bar"><i style="width:${mem}%;background:#a78bfa"></i></div>`}
function drawLine(a,b){const na=state.nodes.find(n=>n.id===a), nb=state.nodes.find(n=>n.id===b);if(!na||!nb)return;const ca=center(na), cb=center(nb);const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',ca.x);line.setAttribute('y1',ca.y);line.setAttribute('x2',cb.x);line.setAttribute('y2',cb.y);line.setAttribute('stroke',state.failed.has(a)||state.failed.has(b)?'rgba(251,113,133,.45)':'rgba(148,163,184,.55)');line.setAttribute('stroke-width','3');line.setAttribute('stroke-dasharray','8 7');$('svg').appendChild(line);}
function pathForRequest(index){const apps=state.nodes.filter(n=>n.id.startsWith('app')&&!state.failed.has(n.id));if(apps.length===0)return null;let app=apps[0],algo=$('algorithm').value;if(algo==='roundRobin'){app=apps[state.rr++%apps.length];}else if(algo==='random'){app=apps[Math.floor(Math.random()*apps.length)];}else if(algo==='leastConnection'){app=apps.slice().sort((a,b)=>(state.connections[a.id]||0)-(state.connections[b.id]||0))[0];}else if(algo==='ipHash'){const fakeIp=index%5;app=apps[fakeIp%apps.length];}else if(algo==='weighted'){let pool=[];apps.forEach(a=>{for(let i=0;i<(a.weight||1);i++)pool.push(a)});app=pool[index%pool.length];}
 const arch=state.arch;if(arch==='small')return ['user','nginx','app1','db1']; if(arch==='medium')return ['user','nginx',app.id,'db1']; return ['user','gcpLb','ingress','svc',app.id,'db1'];}
function hasFailed(path){return path.some(id=>state.failed.has(id));}
function startTraffic(){stopTraffic();resetStats();const total=Number($('trafficCount').value)||10;let i=0;const interval=Math.max(150,Number($('speed').value)/6);state.trafficTimer=setInterval(()=>{if(i>=total){stopTraffic();return}sendOne(i++);},interval);log(`開始送出 ${total} 筆流量，演算法：${$('algorithm').selectedOptions[0].textContent}`);}
function stopTraffic(){if(state.trafficTimer)clearInterval(state.trafficTimer);state.trafficTimer=null;}
async function sendOne(index){const path=pathForRequest(index);state.stats.total++;if(!path||hasFailed(path)){state.stats.drop++;updateStats();if(path)await animatePath(path,'drop');log(`Request #${index+1} 遇到故障，流量被拒絕或等待重試`);return;}const appId=path.find(id=>id.startsWith('app'));state.connections[appId]=(state.connections[appId]||0)+1;render();await animatePath(path,'req');await wait(120);await animatePath([...path].reverse(),'res');state.connections[appId]=Math.max(0,(state.connections[appId]||0)-1);state.stats.success++;updateStats();render();log(`Request #${index+1} -> ${nodeTitle(appId)} 成功回應`);}
function animatePath(path,type){return new Promise(resolve=>{let segment=0;const packet=document.createElement('div');packet.className='packet '+type;$('diagram').appendChild(packet);const speed=Number($('speed').value);function moveSegment(){if(segment>=path.length-1){packet.remove();resolve();return}const a=state.nodes.find(n=>n.id===path[segment]),b=state.nodes.find(n=>n.id===path[segment+1]);const ca=center(a),cb=center(b);const start=performance.now();function frame(now){const t=Math.min(1,(now-start)/(speed/(path.length-1)));const x=ca.x+(cb.x-ca.x)*t;const y=ca.y+(cb.y-ca.y)*t;packet.style.left=(x-7)+'px';packet.style.top=(y-7)+'px';if(t<1)requestAnimationFrame(frame);else{segment++;moveSegment();}}requestAnimationFrame(frame)}moveSegment();});}
function failSelected(){const id=$('failureTarget').value;if(!id)return;state.failed.add(id);render();log(`${nodeTitle(id)} 故障：開始冒紅光，健康檢查失敗`);showFixGuide();}
function repairSelected(){const id=$('failureTarget').value;if(!id)return;state.failed.delete(id);render();log(`${nodeTitle(id)} 已修復 / 重啟完成，重新加入流量`);}
function showFixGuide(){const id=$('failureTarget').value;const n=state.nodes.find(n=>n.id===id);if(!n)return;let guide=repairGuide(n);$('modalTitle').textContent=`${n.title} 故障修復教學`;$('modalBody').innerHTML=guide;$('modal').classList.add('show');}
function repairGuide(n){const common=`<p class="desc">先判斷是入口、VM、容器、Pod、資料庫還是網路問題。正式環境不要直接重啟，要先看 log、健康檢查與監控。</p>`;let code='';if(n.id.includes('nginx'))code=`sudo systemctl status nginx\nsudo nginx -t\nsudo journalctl -u nginx -n 100\nsudo systemctl restart nginx`;
else if(n.id.startsWith('app'))code= state.arch==='large'?`kubectl get pods -n backend\nkubectl describe pod <pod-name> -n backend\nkubectl logs <pod-name> -n backend --tail=100\nkubectl rollout restart deployment/api -n backend`:`docker ps -a\ndocker logs <container-name> --tail=100\ndocker restart <container-name>\npm2 status\npm2 restart all`;
else if(n.id.includes('db'))code=`檢查連線數、CPU、慢查詢、磁碟空間\n查看 DB log\n確認備份與 replica 狀態\n必要時切換 replica / 提升規格`;
else if(n.id.includes('gcpLb'))code=`GCP Console -> Load Balancer -> Backend Health\n檢查 Health Check Path\n確認 Firewall Rule\n確認 Backend Instance Group 是否健康`;
else if(n.id.includes('svc')||n.id.includes('ingress'))code=`kubectl get ingress,svc,endpoints -A\nkubectl describe ingress <name> -n <ns>\nkubectl get endpoints <service> -n <ns>`;
else code=`ping / curl 健康檢查\n查看 GCP Monitoring\n確認 Firewall / Route / DNS`;
return common+`<div>${['故障類型','原因','修復方向'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><h4>建議處理指令</h4><div class="fix-code">${code}</div>`}
function horizontalScale(){const apps=state.nodes.filter(n=>n.id.startsWith('app'));const base=apps[apps.length-1];const newId='app'+(apps.length+1);const y=Math.min(560,80+apps.length*90);const newNode={...base,id:newId,title:(state.arch==='large'?'Pod ':'App VM ')+(apps.length+1),x:base.x,y,sub:state.arch==='large'?'Container: Node API\n水平擴容新增 Pod':'Docker / Node.js\n水平擴容新增 VM',scaled:true,weight:1};state.nodes.push(newNode);state.edges.push([state.arch==='large'?'svc':'nginx',newId],[newId,'db1']);state.scale++;renderControls();render();updateStats();log(`水平擴容：新增 ${newNode.title}，後續流量可分擔到新節點`);}
function verticalScale(){state.vertical++;state.nodes.filter(n=>n.id.startsWith('app')||n.id==='vm1').forEach(n=>{n.scaled=true;n.sub=n.sub+'\n升規 +CPU/+RAM'});render();log('垂直升規：提升現有 VM / Pod 資源限制，例如 2C4G -> 4C8G');}
function resetScale(){loadArch(state.arch);log('已重置擴容與升規狀態');}
function nodeTitle(id){return (state.nodes.find(n=>n.id===id)||{}).title||id}
function resetStats(){state.stats={total:0,success:0,drop:0};state.connections={};updateStats();}
function updateStats(){$('totalReq').textContent=state.stats.total;$('successReq').textContent=state.stats.success;$('dropReq').textContent=state.stats.drop;$('scaleInfo').textContent=state.scale;}
function log(msg){const time=new Date().toLocaleTimeString();$('log').innerHTML=`[${time}] ${msg}<br>`+$('log').innerHTML;}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function closeModal(){$('modal').classList.remove('show')}
init();
</script>
</body>
