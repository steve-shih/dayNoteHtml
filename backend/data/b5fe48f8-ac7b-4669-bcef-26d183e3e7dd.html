<header><h1>Design Patterns × SOLID 終極互動圖解 v3</h1><div class="sub">每個 Pattern 都使用專屬圖型語意；底部提供「遇到系統需求時如何選擇模式」的複雜決策樹。點左側選單可切換說明與圖。</div></header>
<div class="layout">
<aside><input id="search" class="search" placeholder="搜尋 Strategy、Factory、SRP、快取、狀態..."/><div id="menu"></div></aside>
<main>
<div class="topGrid">
<section class="card"><h2 id="title"></h2><div id="tags"></div><p id="plain" class="desc"></p><div class="grid2"><div><h3>適合時機</h3><ul id="when" class="list"></ul></div><div><h3>避免濫用</h3><ul id="avoid" class="list"></ul></div></div><div class="section"><h3>元素解釋</h3><div id="elements"></div></div></section>
<section class="card"><div class="tabs"><button class="tab active" data-tab="diagram">專屬圖</button><button class="tab" data-tab="case">案例</button><button class="tab" data-tab="code">程式骨架</button></div><div id="tab-diagram"><div id="diagram" class="diagram"></div></div><div id="tab-case" style="display:none"><div id="case" class="info"></div></div><div id="tab-code" style="display:none"><pre id="code" class="code"></pre></div></section>
</div>
<section id="decision" class="card decision"><div class="decisionHeader"><div><h2>終極決策樹：遇到系統需求時，怎樣選 Pattern？</h2><div class="miniNote">從「變化點」開始判斷：建立物件、組合結構、流程行為、跨模組通知、狀態、演算法、權限控制。葉節點可點選，會跳到對應 Pattern。</div></div><a class="jump" href="#decision">固定看決策樹</a></div><div class="treeWrap" id="decisionTree"></div><div class="recommend" id="recommend"></div></section>
</main></div>

{id:'composite',name:'Composite',en:'組合',kind:'Structural',diagram:'tree',plain:'單一物件和群組物件用同一方式處理。白話：資料夾和檔案都能算大小。',when:['樹狀資料','單一與群組要一致操作','選單、組織、權限'],avoid:['不是階層資料','父子行為差異過大'],elements:['Component：共同介面','Leaf：葉節點','Composite：群組節點','Recursive：遞迴操作'],case:'權限選單、部門組織、表單題組。',code:'class MenuGroup { render(){ return this.children.map(c=>c.render()).join(""); } }'},

function renderMenu(filter=''){const menu=document.getElementById('menu');menu.innerHTML='';const q=filter.trim().toLowerCase();categories.forEach(cat=>{const items=cat.items.filter(i=>(i.name+' '+i.en+' '+i.plain+' '+i.when.join(' ')).toLowerCase().includes(q));if(!items.length)return;menu.insertAdjacentHTML('beforeend',`<div class="group">${cat.name}</div>`);items.forEach(i=>{const b=document.createElement('button');b.className='btn';b.dataset.id=i.id;b.innerHTML=`${i.name}<small>${i.en}</small>`;b.onclick=()=>select(i.id);menu.appendChild(b);});});}
function safeList(arr){return arr.map(x=>`<li>${x}</li>`).join('')}
function select(id){const item=all.find(x=>x.id===id)||all.find(x=>x.id==='strategy');document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active',b.dataset.id===item.id));document.getElementById('title').textContent=item.name;document.getElementById('tags').innerHTML=`<span class="tag">${item.category}</span><span class="tag">${item.en}</span><span class="tag">${item.kind}</span>`;document.getElementById('plain').textContent=item.plain;document.getElementById('when').innerHTML=safeList(item.when);document.getElementById('avoid').innerHTML=safeList(item.avoid);document.getElementById('elements').innerHTML=item.elements.map(x=>`<div class="element">${x}</div>`).join('');document.getElementById('case').innerHTML=`<h3>複雜舉例</h3><p>${item.case}</p><p class="miniNote">判斷重點：先找變化點，再決定要保護哪個穩定區域。Pattern 不是為了炫技，而是為了把未來最可能變動的地方隔離。</p>`;document.getElementById('code').textContent=item.code;document.getElementById('diagram').innerHTML=diagram(item.diagram,item)+`<div class="legend">這張圖依 ${item.name} 的核心特徵設計，不共用統一模板；每個節點都對應下方元素解釋。</div>`;location.hash=item.id;}
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');['diagram','case','code'].forEach(name=>document.getElementById('tab-'+name).style.display=tab.dataset.tab===name?'block':'none');});
document.getElementById('search').addEventListener('input',e=>renderMenu(e.target.value));

document.getElementById('decisionTree').innerHTML=decisionTree();
document.getElementById('decisionTree').addEventListener('click',e=>{const leaf=e.target.closest('.leaf');if(leaf){select(leaf.dataset.id);window.scrollTo({top:0,behavior:'smooth'});}});
